<!DOCTYPE html>
<html lang="en">
<head>
    <title>Card Showcase: Contact</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="wrapper">

    <nav class="stick tab-desk">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="newCards.html">New Cards</a></li>
            <li><a href="cardShops.html">Stores</a></li>
        </ul>
    </nav>

    <main>

        <div id="contact">
            <form>
                <!-- Start Form -->
                <fieldset>
                    <legend>What You Want Featured</legend>
                    <label><input
                            type="checkbox"
                            id="New Deck"
                            value="Deck"
                    />Deck</label>
                    <label><input
                            type="checkbox"
                            id="New Card Game"
                            value="Card Game"
                    />Card Game</label>
                    <label><input
                            type="checkbox"
                            id="New Card"
                            value="Card"
                    />Card</label>
                </fieldset>

                <fieldset>
                    <legend>Request Information</legend>
                    <label for="name">Name:</label>
                    <input type="text" name="Name" id="name"/>

                    <label for="game">Game:</label>
                    <input type="text" name="Game" id="game"/>


                    <label for="card">Card/Deck Name:</label>
                    <input type="text" name="Card" id="card"/>

                </fieldset>

                <input type="submit" id="submit" value="Submit" class="btn">
            </form>
        </div>

        <div id="info">
            <h2>Contact Us</h2>
            <p>Contact at: <a href="mailto: fake-email">stand-in@email.com</a></p>
        </div>

    </main>
    <footer>
        <p><a href="mailto: fake-email">stand-in@email.com</a></p>
    </footer>
</div>
</body>
</html>
